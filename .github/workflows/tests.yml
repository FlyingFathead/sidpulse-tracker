name: Native editor checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Install FFmpeg for Windows media tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "FFmpeg installation failed with exit code $LASTEXITCODE"
          }
          $ffmpeg = (Get-Command ffmpeg.exe -CommandType Application -ErrorAction Stop).Source
          "SIDPULSE_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Rebuild and compare C64 replay images
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y 64tass ffmpeg
          python scripts/build_squeeze_players.py --check
          python scripts/build_pcm_player.py --check
      - name: Verify FFmpeg before running tests
        shell: python
        run: |
          import subprocess
          from sidpulse.audio.media import ffmpeg_path
          executable = ffmpeg_path()
          print('FFmpeg:', executable, flush=True)
          subprocess.run([executable, '-version'], check=True)
      - run: python -m pytest -q
      - run: python -m sidpulse --headless-smoke --example
      - run: python -m sidpulse --headless-smoke --play-welcome-song
      - name: Windows setup cancellation leaves the environment untouched
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo n| run.cmd --headless-smoke --example
          if errorlevel 1 exit /b 1
          if exist .venv exit /b 1
      - name: Windows setup approval and ready-environment launch
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          echo y| run.cmd --headless-smoke --example --screenshot first-launch.png
          if errorlevel 1 exit /b 1
          if not exist first-launch.png exit /b 1
          echo n| run.cmd --headless-smoke --example --screenshot next-launch.png
          if errorlevel 1 exit /b 1
          if not exist next-launch.png exit /b 1
